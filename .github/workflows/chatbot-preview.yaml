name: Chatbot Vercel Preview

on:
  push:
    branches-ignore:
      - main
    paths:
      - "chatbot/**"
      - ".github/workflows/chatbot-preview.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy preview to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.CHATBOT_VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.CHATBOT_VERCEL_PROJECT_ID }}
          working-directory: ./chatbot
