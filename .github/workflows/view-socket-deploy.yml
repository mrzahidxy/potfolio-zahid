name: Deploy View Socket

on:
  push:
    branches:
      - main
    paths:
      - "view-socket/**"
      - ".github/workflows/view-socket-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./view-socket
          push: true
          tags: |
            zayedsagor/view-socket:latest
            zayedsagor/view-socket:${{ github.sha }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/view-socket
            docker compose pull
            docker compose up -d
            docker image prune -f

            check() { curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "$1"; }
            check http://127.0.0.1:8010/health
            check http://127.0.0.1:8010/ready
            check https://view-socket.flowstacker.xyz/health
            check https://view-socket.flowstacker.xyz/ready
