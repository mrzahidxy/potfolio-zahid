name: Build and Push View Socket Image

on:
  push:
    branches: [main]
    paths:
      - "view-socket/**"
      - ".github/workflows/view-socket-dockerhub.yaml"
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./view-socket
          file: ./view-socket/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/view-socket:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/view-socket:${{ github.sha }}
